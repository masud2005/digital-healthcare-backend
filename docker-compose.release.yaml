services:
    caddy:
        image: caddy:2-alpine
        container_name: digital-healthcare-backend-caddy
        environment:
            - LIVE_UPSTREAM=${LIVE_UPSTREAM:-app_live_blue:5056}
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
            - /var/projects/doc-dashboard:/var/projects/doc-dashboard
        restart: unless-stopped
        networks:
            - doc_release

    app_live_blue:
        image: ${BLUE_IMAGE:-${APP_IMAGE:-softvence/digital-healthcare-backend:latest}}
        container_name: digital-healthcare-backend-live-blue
        env_file:
            - path: .env.production
              required: false
        environment:
            - NODE_ENV=production
            - PORT=5056
            - DATABASE_URL=postgresql://${POSTGRES_USER:-doc}:${POSTGRES_PASSWORD:-doc}@db_live:5432/${POSTGRES_DB:-doc}
            - MINIO_ENDPOINT=http://minio-storage-live:9000
            - MINIO_PUBLIC_ENDPOINT=https://storage.weightlossmdcherrycreek.com
            - MINIO_USER=${MINIO_ROOT_USER:-admin}
            - MINIO_PASS=${MINIO_ROOT_PASSWORD:-admin123}
        depends_on:
            db_live:
                condition: service_healthy
            minio_live:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://localhost:5056${HEALTH_PATH:-/api/v1/api/health} >/dev/null || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s
        restart: unless-stopped
        command: >
            sh -c "
                npm run start:docker
            "
        networks:
            - doc_release

    app_live_green:
        image: ${GREEN_IMAGE:-${APP_IMAGE:-softvence/digital-healthcare-backend:latest}}
        container_name: digital-healthcare-backend-live-green
        env_file:
            - path: .env.production
              required: false
        environment:
            - NODE_ENV=production
            - PORT=5056
            - DATABASE_URL=postgresql://${POSTGRES_USER:-doc}:${POSTGRES_PASSWORD:-doc}@db_live:5432/${POSTGRES_DB:-doc}
            - MINIO_ENDPOINT=http://minio-storage-live:9000
            - MINIO_PUBLIC_ENDPOINT=https://storage.weightlossmdcherrycreek.com
            - MINIO_USER=${MINIO_ROOT_USER:-admin}
            - MINIO_PASS=${MINIO_ROOT_PASSWORD:-admin123}
        depends_on:
            db_live:
                condition: service_healthy
            minio_live:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://localhost:5056${HEALTH_PATH:-/api/v1/api/health} >/dev/null || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s
        restart: unless-stopped
        command: >
            sh -c "
                npm run start:docker
            "
        networks:
            - doc_release

    app_pre:
        image: ${PRE_IMAGE:-${APP_IMAGE:-softvence/digital-healthcare-backend:latest}}
        container_name: digital-healthcare-backend-pre
        env_file:
            - path: .env.prerelease
              required: false
        environment:
            - NODE_ENV=staging
            - PORT=5056
            - DATABASE_URL=postgresql://${POSTGRES_USER:-doc}:${POSTGRES_PASSWORD:-doc}@db_pre:5432/${POSTGRES_DB:-doc}
            - MINIO_ENDPOINT=http://minio-storage-pre:9000
            - MINIO_PUBLIC_ENDPOINT=https://pre-storage.weightlossmdcherrycreek.com
            - MINIO_USER=${MINIO_ROOT_USER:-admin}
            - MINIO_PASS=${MINIO_ROOT_PASSWORD:-admin123}
        depends_on:
            db_pre:
                condition: service_healthy
            minio_pre:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://localhost:5056${HEALTH_PATH:-/api/v1/api/health} >/dev/null || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s
        restart: unless-stopped
        command: >
            sh -c "
                npm run start:docker
            "
        networks:
            - doc_release

    db_live:
        image: postgres:16-alpine
        container_name: digital-healthcare-backend-db-live
        environment:
            - POSTGRES_USER=${POSTGRES_USER:-doc}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-doc}
            - POSTGRES_DB=${POSTGRES_DB:-doc}
            - PGDATA=/var/lib/postgresql/data/pgdata
        volumes:
            - doc_live_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doc} -d ${POSTGRES_DB:-doc}"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped
        networks:
            - doc_release

    db_pre:
        image: postgres:16-alpine
        container_name: digital-healthcare-backend-db-pre
        environment:
            - POSTGRES_USER=${POSTGRES_USER:-doc}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-doc}
            - POSTGRES_DB=${POSTGRES_DB:-doc}
            - PGDATA=/var/lib/postgresql/data/pgdata
        volumes:
            - doc_pre_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doc} -d ${POSTGRES_DB:-doc}"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped
        networks:
            - doc_release

    minio_live:
        image: minio/minio:latest
        container_name: minio-storage-live
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin123}
            MINIO_BROWSER_REDIRECT_URL: https://storage-console.weightlossmdcherrycreek.com
            MINIO_SERVER_URL: https://storage.weightlossmdcherrycreek.com
        volumes:
            - minio_data:/data
        command: server /data --console-address ":9001"
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 30s
            timeout: 10s
            retries: 3
        networks:
            - doc_release

    minio_pre:
        image: minio/minio:latest
        container_name: minio-storage-pre
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin123}
            MINIO_BROWSER_REDIRECT_URL: https://pre-storage-console.weightlossmdcherrycreek.com
            MINIO_SERVER_URL: https://pre-storage.weightlossmdcherrycreek.com
        volumes:
            - minio_pre_data:/data
        command: server /data --console-address ":9001"
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 30s
            timeout: 10s
            retries: 3
        networks:
            - doc_release

    minio_mc:
        image: minio/mc:latest
        entrypoint: ["/bin/sh", "-c", "exit 0"]
        restart: "no"
        networks:
            - doc_release

volumes:
    caddy_data:
    caddy_config:
    doc_live_data:
    doc_pre_data:
    minio_data:
    minio_pre_data:

networks:
    doc_release:
        driver: bridge
